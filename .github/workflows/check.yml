# Runs every chapter against the lab on both CPU types.
# Ubuntu 22.04 runners (kernel 6.8): on the Ubuntu 24.04 runners (kernel 7.0) the
# syscall tracepoints of chapter 1 miss events. See the README.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Kernel and Docker
        run: uname -a && docker version --format '{{.Server.Version}}'
      - name: All chapters
        run: ./lab/check.sh
      - name: Container logs
        if: failure()
        run: docker compose -f lab/compose.yaml logs --tail 100
